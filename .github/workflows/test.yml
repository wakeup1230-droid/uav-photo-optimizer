name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ExifTool
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl

      - name: Install package
        run: python -m pip install -e ".[dev]"

      # Synthetic test data only; Regression 001 (real data) is excluded via pytest addopts.
      - name: pytest
        run: python -m pytest -v

  # v1.0 scope: the core selection must work without any optional / experimental extra
  # (no OpenCV, cameratransform, rasterio, weitsicht, FastAPI).
  core-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ExifTool
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl

      - name: Install core only
        run: python -m pip install -e . pytest Pillow

      - name: pytest
        run: python -m pytest -v

  # Package build: sdist + wheel, clean install of the wheel, CLI and API smoke test.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

      - name: Install wheel with the api extra
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install "$(ls dist/*.whl)[api]"

      - name: CLI and API smoke test
        run: |
          /tmp/clean/bin/uav-photo-optimizer --help
          /tmp/clean/bin/uav-photo-optimizer serve --port 8765 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/api/v1/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8765/api/v1/health | grep '"status":"ok"'
